<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIX VM Debugger</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="assembler.js"></script>
</head>
<body>
  <div id="app" x-data="vm" class="app">

    <header class="header">
      <span class="title">MIX VM Debugger</span>
      <span class="status" :class="statusClass" x-text="status"></span>
    </header>

    <div class="toolbar">
      <button @click="stepBack()" :disabled="!loaded || history.length === 0" class="btn" title="Step backward (undo)">&#8592; Back</button>
      <button @click="step()"     :disabled="!loaded || running"             class="btn btn-accent" title="Step forward">Step &#8594;</button>
      <button @click="toggleRun()" :disabled="!loaded" class="btn" :class="running ? 'btn-stop' : 'btn-run'">
        <span x-text="running ? '&#9646;&#9646; Stop' : '&#9654; Run'"></span>
      </button>
      <div class="sep"></div>
      <button @click="reset()" :disabled="!loaded" class="btn btn-danger">Reset</button>
      <div class="sep"></div>
      <button @click="$refs.mixFile.click()" :disabled="!loaded" class="btn btn-load" title="Load a compiled .mix file into VM memory">
        &#128194; Load .mix
      </button>
      <input type="file" x-ref="mixFile" accept=".mix" @change="loadMixFile($event)" style="display:none" />
      <div class="sep"></div>
      <label class="speed-label">
        Speed:
        <input type="range" min="1" max="200" x-model.number="runSpeed" @change="applySpeed()" class="speed-slider" />
        <span x-text="runSpeed + ' Hz'"></span>
      </label>
      <div class="sep"></div>
      <button @click="view = 'debug'"  class="btn btn-small" :class="view === 'debug'  ? 'btn-accent' : ''">Debugger</button>
      <button @click="view = 'asm'"    class="btn btn-small" :class="view === 'asm'    ? 'btn-accent' : ''">Assembler</button>
    </div>

    <div class="main" x-show="loaded && view === 'debug'">

      <aside class="sidebar">
        <section class="panel">
          <h2>VM State</h2>
          <table class="info-table">
            <tr><td>PC</td>     <td class="val mono" x-text="fmtAddr(pc)"></td></tr>
            <tr><td>Cycle</td>  <td class="val mono" x-text="cycle"></td></tr>
            <tr><td>Halted</td> <td class="val mono" :class="halted ? 'bad' : ''" x-text="halted ? 'YES' : 'no'"></td></tr>
            <tr><td>History</td><td class="val mono" x-text="history.length + ' / ' + MAX_HISTORY"></td></tr>
          </table>
        </section>

        <section class="panel">
          <h2>Registers</h2>
          <table class="info-table">
            <tr><td>rA</td>  <td class="val mono" x-text="fmtWord(regA)"></td></tr>
            <tr><td>rX</td>  <td class="val mono" x-text="fmtWord(regX)"></td></tr>
            <template x-for="(v, i) in regI" :key="i">
              <tr>
                <td class="mono" x-text="'rI' + (i + 1)"></td>
                <td class="val mono" x-text="fmtIndex(v)"></td>
              </tr>
            </template>
            <tr><td>rJ</td>  <td class="val mono" x-text="fmtAddr(regJ)"></td></tr>
            <tr><td>OV</td>  <td class="val mono" :class="overflow ? 'bad' : ''" x-text="overflow ? '1' : '0'"></td></tr>
            <tr><td>CMP</td> <td class="val mono" x-text="cmpLabel(cmp)"></td></tr>
          </table>
        </section>
      </aside>

      <main class="mem-panel">
        <div class="mem-toolbar">
          <h2>Memory</h2>
          <div class="mem-nav">
            <button @click="jumpToPC()" class="btn btn-small">&#8594; PC</button>
            <button @click="prevPage()" :disabled="memPage === 0" class="btn btn-small">&#9650;</button>
            <span class="page-info" x-text="'Page ' + (memPage + 1) + ' / ' + totalPages"></span>
            <button @click="nextPage()" :disabled="memPage >= totalPages - 1" class="btn btn-small">&#9660;</button>
            <input
              type="number" min="0" max="3999"
              x-model.number="gotoAddr"
              @keydown.enter="jumpToAddr()"
              placeholder="addr 0–3999"
              class="addr-input"
              title="Type address and press Enter"
            />
          </div>
        </div>

        <div class="mem-scroll">
          <table class="mem-table">
            <thead>
              <tr>
                <th>Addr</th>
                <th>±</th>
                <th>b0</th><th>b1</th><th>b2</th><th>b3</th><th>b4</th>
                <th class="instr-col">Instruction</th>
                <th class="val-col">Value</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="w in visibleWords" :key="w.addr">
                <tr :class="w.addr === pc ? 'current-pc' : (breakpoints[w.addr] ? 'bp-row' : '')"
                    @click="toggleBreakpoint(w.addr)" style="cursor:pointer">
                  <td class="c-addr" x-text="(breakpoints[w.addr] ? '● ' : '') + String(w.addr).padStart(4,'0')"></td>
                  <td class="c-sign" x-text="w.sign ? '−' : '+'"></td>
                  <template x-for="(b, i) in w.bytes" :key="i">
                    <td class="c-byte" x-text="String(b).padStart(2,'0')"></td>
                  </template>
                  <td class="c-instr" x-text="w.instr"></td>
                  <td class="c-val"  x-text="w.value"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </main>

    </div>

    <!-- ── Assembler view ──────────────────────────────────────────────── -->
    <div class="asm-panel" x-show="loaded && view === 'asm'">
      <div class="asm-toolbar">
        <div style="display:flex;gap:6px;align-items:center;">
          <button @click="asmAssemble()" class="btn btn-run">&#9654; Assemble &amp; Load</button>
          <select class="btn" @change="asmLoadExample($event)">
            <option value="">Load example…</option>
            <option value="gcd">GCD (Euclid)</option>
            <option value="max">Find Maximum</option>
          </select>
        </div>
        <span class="page-info" x-text="asmStatusText"></span>
      </div>
      <div class="asm-body">
        <textarea
          class="asm-src"
          x-model="asmSource"
          placeholder="Write MIXAL assembly here…"
          spellcheck="false"
        ></textarea>
        <div class="asm-output" x-show="asmErrors.length > 0 || asmOutput">
          <template x-for="err in asmErrors" :key="err">
            <div class="asm-err" x-text="err"></div>
          </template>
          <div class="asm-ok" x-show="asmErrors.length === 0 && asmOutput" x-text="asmOutput"></div>
        </div>
      </div>
    </div>

    <div class="welcome" x-show="!loaded">
      <div x-show="!error">
        <span x-text="loading ? 'Loading…' : 'Initializing…'"></span>
      </div>
      <div class="err" x-show="error" x-text="'Error: ' + error"></div>
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
